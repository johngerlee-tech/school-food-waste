<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>惜食榮譽榜 A1 印刷海報產製系統 - 溪洲國小</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .poster-canvas-wrapper {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  
  <!-- 頂部控制列 -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🌱</span>
        <div>
          <h1 class="text-lg font-bold tracking-wide">溪洲國小午餐惜食榮譽榜 A1 印刷海報產製器</h1>
          <p class="text-xs text-emerald-200">擬真 ChatGPT 海報插畫美學・真正人均廚餘量・高畫質 300 DPI 印刷輸出</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded text-xs font-semibold tracking-wide transition flex items-center gap-1">
          ⬅ 回主系統
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- 控制面板 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-3">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
          <span>⚙️</span> 海報統計範圍設定
        </h2>
        <span id="db-status" class="text-xs px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full font-medium">
          連線資料庫中...
        </span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">統計模式</label>
          <select id="mode-select" class="w-full border rounded-lg p-2 bg-slate-50 focus:bg-white" onchange="toggleMode()">
            <option value="month" selected>依月份指定（自動對應週次）</option>
            <option value="custom">自選起訖週次（如第4週到第6週）</option>
          </select>
        </div>

        <div id="month-group">
          <label class="block font-semibold text-slate-600 mb-1">選擇月份</label>
          <select id="select-month" class="w-full border rounded-lg p-2 bg-slate-50" onchange="syncMonthToWeeks()">
            <option value="9">9 月份 (第 1 ~ 3 週海報)</option>
            <option value="10" selected>10 月份 (第 4 ~ 6 週海報)</option>
            <option value="11">11 月份 (第 7 ~ 9 週海報)</option>
            <option value="12">12 月份 (第 10 ~ 12 週海報)</option>
          </select>
        </div>

        <div id="custom-group" class="hidden items-center gap-2 md:col-span-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-600 mb-1">起始週次</label>
            <input type="number" id="start-week" value="4" min="1" max="25" class="w-full border rounded-lg p-2 bg-slate-50">
          </div>
          <span class="pt-6 font-bold text-slate-400">至</span>
          <div class="flex-1">
            <label class="block font-semibold text-slate-600 mb-1">結束週次</label>
            <input type="number" id="end-week" value="6" min="1" max="25" class="w-full border rounded-lg p-2 bg-slate-50">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">學年度</label>
          <input type="number" id="academic-year" value="115" class="w-full border rounded-lg p-2 bg-slate-50">
        </div>
      </div>

      <!-- 按鈕列 -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <div class="text-xs text-slate-500">
          💡 海報標準版面以 3 個連續週次為最佳視覺比例（如第1~3週、第4~6週）。
        </div>
        <div class="flex gap-2">
          <button onclick="fetchAndRenderPoster()" id="render-btn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-2">
            <span>🚀</span> 撈取真實人均並繪製海報
          </button>
          <button onclick="downloadPosterImage()" id="download-btn" disabled class="px-5 py-2.5 bg-slate-200 text-slate-400 font-bold rounded-xl shadow-sm transition flex items-center gap-2 cursor-not-allowed">
            <span>📥</span> 下載 A1 印刷高畫質 PNG (300 DPI)
          </button>
        </div>
      </div>
    </section>

    <!-- Canvas 海報預覽畫布 -->
    <section class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
      <div class="w-full flex items-center justify-between mb-4 border-b pb-2">
        <span class="font-bold text-slate-700">🖼️ A1 海報即時渲染預覽 (點擊下載可取得 7016 × 9933 像素無損印刷原圖)</span>
        <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
          A1 規格 300 DPI (7016 × 9933 px)
        </span>
      </div>

      <div class="poster-canvas-wrapper bg-white rounded-xl overflow-hidden border border-slate-300 max-w-full md:max-w-2xl">
        <canvas id="posterCanvas" class="w-full h-auto block"></canvas>
      </div>
    </section>

  </main>

  <!-- 邏輯腳本 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getFirestore, collection, getDocs, query, where 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6xjT4asS3xcpRrgLD33jrssSIzmh0ix4",
      authDomain: "school-food-waste.firebaseapp.com",
      projectId: "school-food-waste",
      storageBucket: "school-food-waste.firebasestorage.app",
      messagingSenderId: "1056761999500",
      appId: "1:1056761999500:web:1014f9ec8d320391ce8ba9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 10 個正式評比班級清單 (一年級免秤自動排除)
    const EVAL_CLASSES = [
      { id: '201', name: '二年甲班', short: '二甲', stage: '低年級' },
      { id: '202', name: '二年乙班', short: '二乙', stage: '低年級' },
      { id: '301', name: '三年甲班', short: '三甲', stage: '中年級' },
      { id: '302', name: '三年乙班', short: '三乙', stage: '中年級' },
      { id: '401', name: '四年甲班', short: '四甲', stage: '中年級' },
      { id: '402', name: '四年乙班', short: '四乙', stage: '中年級' },
      { id: '501', name: '五年甲班', stand: '五甲', short: '五甲', stage: '高年級' },
      { id: '502', name: '五年乙班', short: '五乙', stage: '高年級' },
      { id: '601', name: '六年甲班', short: '六甲', stage: '高年級' },
      { id: '602', name: '六年乙班', short: '六乙', stage: '高年級' }
    ];

    const CANVAS_WIDTH = 7016;
    const CANVAS_HEIGHT = 9933;

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const urlYear = params.get('year');
      const urlMonth = params.get('month');

      if (urlYear) document.getElementById('academic-year').value = urlYear;
      if (urlMonth) {
        document.getElementById('select-month').value = urlMonth;
        window.syncMonthToWeeks();
      }

      document.getElementById('db-status').textContent = "🟢 雲端資料庫已就緒";
      document.getElementById('db-status').className = "text-xs px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full font-medium";

      window.fetchAndRenderPoster();
    });

    window.toggleMode = function() {
      const mode = document.getElementById('mode-select').value;
      if (mode === 'month') {
        document.getElementById('month-group').classList.remove('hidden');
        document.getElementById('custom-group').classList.add('hidden');
        window.syncMonthToWeeks();
      } else {
        document.getElementById('month-group').classList.add('hidden');
        document.getElementById('custom-group').classList.remove('hidden');
        document.getElementById('custom-group').classList.add('flex');
      }
    };

    window.syncMonthToWeeks = function() {
      const m = parseInt(document.getElementById('select-month').value, 10);
      const map = { 9: [1, 3], 10: [4, 6], 11: [7, 9], 12: [10, 12] };
      const [sw, ew] = map[m] || [1, 3];
      document.getElementById('start-week').value = sw;
      document.getElementById('end-week').value = ew;
    };

    // 核心數據擷取與【真正人均】運算
    window.fetchAndRenderPoster = async function() {
      const btn = document.getElementById('render-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>⏳</span> 運算與繪圖中...`;

      const year = parseInt(document.getElementById('academic-year').value, 10) || 115;
      const startW = parseInt(document.getElementById('start-week').value, 10);
      const endW = parseInt(document.getElementById('end-week').value, 10);
      const monthVal = parseInt(document.getElementById('select-month').value, 10);

      try {
        const snap = await getDocs(query(
          collection(db, "daily_records"),
          where("academicYear", "==", year)
        ));

        const allLogs = snap.docs.map(d => d.data());

        const weeksArray = [];
        for (let w = startW; w <= endW; w++) weeksArray.push(w);

        // 統計各班各週加權人均 (包含前一週作為比對基準)
        const weeklyStats = {}; // week -> { classId -> perCapita }
        for (let w = (startW - 1); w <= endW; w++) {
          weeklyStats[w] = {};
          const wLogs = allLogs.filter(l => parseInt(l.week) === w && !l.isSkipped);

          EVAL_CLASSES.forEach(c => {
            const cLogs = wLogs.filter(l => l.classId === c.id);
            let totalW = 0;
            let totalE = 0;

            cLogs.forEach(l => {
              const eaters = parseInt(l.eaterCount) || 0;
              if (eaters > 0) {
                let wt = parseFloat(l.weightKg) || parseFloat(l.weight) || 0;
                // 自動判斷單位：若數值小於 50 則為 kg，需乘 1000 轉為公克；若已是大於 100 則本質就是公克
                if (wt > 0 && wt < 50) {
                  wt = wt * 1000;
                }
                totalW += wt;
                totalE += eaters;
              }
            });

            // 正確公克人均 = 總克數 ÷ 總人次
            if (totalE > 0) {
              weeklyStats[w][c.id] = Math.round(totalW / totalE);
            } else {
              weeklyStats[w][c.id] = null;
            }
          });
        }

        // 判定各年段週冠軍
        const champions = {};
        const stages = ['低年級', '中年級', '高年級'];
        weeksArray.forEach(w => {
          champions[w] = {};
          stages.forEach(stg => {
            const list = EVAL_CLASSES.filter(c => c.stage === stg && weeklyStats[w][c.id] !== null)
              .map(c => ({ ...c, val: weeklyStats[w][c.id] }))
              .sort((a, b) => a.val - b.val);
            if (list.length > 0) champions[w][stg] = list[0];
          });
        });

        // 判定進步獎 (減幅 >= 5.0%)
        const progressAwards = {};
        weeksArray.forEach(w => {
          progressAwards[w] = [];
          const prevW = w - 1;
          EVAL_CLASSES.forEach(c => {
            const currVal = weeklyStats[w][c.id];
            const prevVal = weeklyStats[prevW] ? weeklyStats[prevW][c.id] : null;
            if (currVal !== null && prevVal !== null && prevVal > 0) {
              const rate = Number((((prevVal - currVal) / prevVal) * 100).toFixed(1));
              if (rate >= 5.0) {
                progressAwards[w].push({
                  id: c.id,
                  name: c.short,
                  fullName: c.name,
                  rate,
                  prevVal,
                  currVal
                });
              }
            }
          });
          progressAwards[w].sort((a, b) => b.rate - a.rate);
        });

        // 繪製海報
        await drawChatGPTStylePoster({
          year,
          month: monthVal,
          startW,
          endW,
          weeksArray,
          weeklyStats,
          champions,
          progressAwards
        });

        const dlBtn = document.getElementById('download-btn');
        dlBtn.disabled = false;
        dlBtn.className = "px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer";

      } catch (err) {
        console.error(err);
        alert("資料讀取發生錯誤：" + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>🚀</span> 撈取真實人均並繪製海報`;
      }
    };

    // 仿 ChatGPT 精緻插畫海報繪製引擎
    async function drawChatGPTStylePoster(data) {
      const canvas = document.getElementById('posterCanvas');
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
      const ctx = canvas.getContext('2d');

      // 背景 (溫潤米白)
      ctx.fillStyle = '#FCFBF4';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 雙層外框
      ctx.strokeStyle = '#275237';
      ctx.lineWidth = 18;
      ctx.strokeRect(90, 90, CANVAS_WIDTH - 180, CANVAS_HEIGHT - 180);

      // 輔助函式：圓角矩形
      function fillRoundRect(x, y, w, h, r, fillColor, strokeColor=null, strokeW=4) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
        if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = strokeW; ctx.stroke(); }
      }

      // 輔助繪製樹葉
      function drawLeaf(x, y, scale=1.0, angle=30, color='#66BB6A') {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((angle * Math.PI) / 180);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(60 * scale, -40 * scale, 120 * scale, 0);
        ctx.quadraticCurveTo(60 * scale, 40 * scale, 0, 0);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#2E7D32';
        ctx.lineWidth = 4 * scale;
        ctx.stroke();
        ctx.restore();
      }

      // -----------------------------------------------------------------
      // 1. 頂部插畫與標題區塊
      // -----------------------------------------------------------------
      // 左上角插畫地球
      const earthX = 620, earthY = 620;
      ctx.beginPath();
      ctx.arc(earthX, earthY, 240, 0, Math.PI * 2);
      ctx.fillStyle = '#81D4FA';
      ctx.fill();
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#29B6F6';
      ctx.stroke();

      // 地球上的綠洲大陸
      ctx.beginPath();
      ctx.arc(earthX - 60, earthY - 40, 110, 0, Math.PI * 2);
      ctx.fillStyle = '#A5D6A7';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(earthX + 70, earthY + 70, 90, 0, Math.PI * 2);
      ctx.fillStyle = '#A5D6A7';
      ctx.fill();

      // 地球笑臉
      ctx.beginPath();
      ctx.arc(earthX - 50, earthY - 10, 20, 0, Math.PI * 2);
      ctx.arc(earthX + 50, earthY - 10, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#263238';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(earthX, earthY + 30, 45, 0, Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#263238';
      ctx.stroke();

      // 地球旁飄落愛心
      ctx.fillStyle = '#FFAB91';
      ctx.beginPath();
      ctx.arc(1200, 400, 50, 0, Math.PI * 2);
      ctx.fill();

      // 左上標籤牌：惜食減廢 從我做起
      fillRoundRect(240, 880, 760, 430, 70, '#E8F5E9', '#2E7D32', 10);
      ctx.fillStyle = '#1B5E20';
      ctx.font = '900 115px "Noto Sans TC"';
      ctx.textAlign = 'center';
      ctx.fillText('惜食減廢', 620, 1050);
      ctx.fillText('從我做起', 620, 1220);

      // 右上角餐盤與刀叉
      const plateX = 6350, plateY = 680;
      ctx.beginPath();
      ctx.arc(plateX, plateY, 230, 0, Math.PI * 2);
      ctx.fillStyle = '#F5F5F5';
      ctx.fill();
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#CFD8DC';
      ctx.stroke();

      // 餐盤笑臉
      ctx.beginPath();
      ctx.arc(plateX - 45, plateY - 10, 16, 0, Math.PI * 2);
      ctx.arc(plateX + 45, plateY - 10, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#37474F';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(plateX, plateY + 25, 40, 0, Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#37474F';
      ctx.stroke();

      // 刀叉
      ctx.fillStyle = '#90A4AE';
      ctx.fillRect(plateX - 350, plateY - 180, 35, 360);
      ctx.fillRect(plateX + 320, plateY - 180, 35, 360);

      // 右上角文字
      ctx.textAlign = 'right';
      ctx.fillStyle = '#2E7D32';
      ctx.font = '900 115px "Noto Sans TC"';
      ctx.fillText('珍惜食物', 6800, 380);
      ctx.font = 'bold 100px "Noto Sans TC"';
      ctx.fillText('守護地球', 6800, 520);
      ctx.font = '500 85px "Noto Sans TC"';
      ctx.fillText('打造永續校園', 6800, 660);

      // 正中大標題
      ctx.textAlign = 'center';
      ctx.font = '900 240px "Noto Sans TC"';
      ctx.fillStyle = '#1B5E39';
      const mText = data.month ? `${data.month}月份` : '全月份';
      ctx.fillText(`${data.year}學年度第一學期 `, CANVAS_WIDTH / 2 - 350, 480);
      ctx.fillStyle = '#E65100';
      ctx.fillText(mText, CANVAS_WIDTH / 2 + 1050, 480);

      // 深綠橫幅泡泡標題
      fillRoundRect(1150, 620, CANVAS_WIDTH - 2300, 440, 220, '#156538', '#0D3C22', 10);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 220px "Noto Sans TC"';
      ctx.fillText('各年段人均廚餘量變化與惜食榮譽榜', CANVAS_WIDTH / 2, 930);

      // 黃金提示標籤
      fillRoundRect(1800, 1140, CANVAS_WIDTH - 3600, 230, 115, '#F5D77F', '#D9B244', 8);
      ctx.fillStyle = '#66480B';
      ctx.font = 'bold 125px "Noto Sans TC"';
      ctx.fillText('各年段分別評比，數值越低表現越好', CANVAS_WIDTH / 2, 1300);

      // 葉子點綴
      drawLeaf(1500, 1200, 1.2, 45, '#4CAF50');
      drawLeaf(CANVAS_WIDTH - 1500, 1200, 1.2, -45, '#4CAF50');

      // -----------------------------------------------------------------
      // 2. 上層：每週週冠軍看板（3 欄對齊）
      // -----------------------------------------------------------------
      const colW = 2050;
      const topY = 1520;
      const gapX = 140;
      const startX = 350;

      data.weeksArray.slice(0, 3).forEach((w, idx) => {
        const cx = startX + idx * (colW + gapX);

        // 外框底卡
        fillRoundRect(cx, topY, colW, 1920, 60, '#FFFDF5', '#C5D6C9', 8);

        // 深綠週標籤頭
        fillRoundRect(cx, topY, colW, 310, 40, '#1B5E39', '#0D3C22', 6);
        ctx.fillStyle = '#FDD835';
        ctx.font = '900 155px "Noto Sans TC"';
        ctx.textAlign = 'left';
        ctx.fillText(`👑 第${w}週`, cx + 120, topY + 220);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 130px "Noto Sans TC"';
        ctx.fillText('各年段週冠軍', cx + 950, topY + 220);

        // 三個年段行卡片
        const stagesCfg = [
          { name: '低年級', bg: '#FFF5E0', tc: '#E65100', clsColor: '#D84315' },
          { name: '中年級', bg: '#E8F5E9', tc: '#2E7D32', clsColor: '#1B5E20' },
          { name: '高年級', bg: '#FFEBEE', tc: '#C62828', clsColor: '#B71C1C' }
        ];

        stagesCfg.forEach((stg, sIdx) => {
          const cy = topY + 370 + sIdx * 480;
          fillRoundRect(cx + 40, cy, colW - 80, 440, 40, stg.bg, '#E0E0E0', 4);

          // 年段小標
          ctx.fillStyle = stg.tc;
          ctx.font = 'bold 105px "Noto Sans TC"';
          ctx.textAlign = 'left';
          ctx.fillText(stg.name, cx + 100, cy + 260);

          // 冠軍班級（超大粗體紅色/綠色）
          const champ = data.champions[w] ? data.champions[w][stg.name] : null;
          ctx.fillStyle = stg.clsColor;
          ctx.font = '900 290px "Noto Sans TC"';
          ctx.textAlign = 'center';
          ctx.fillText(champ ? champ.short : '—', cx + 1050, cy + 320);

          // 數值與單位
          ctx.textAlign = 'right';
          ctx.fillStyle = '#212121';
          ctx.font = '900 170px "Noto Sans TC"';
          ctx.fillText(champ ? `${champ.val}` : '0', cx + colW - 140, cy + 240);
          ctx.fillStyle = '#616161';
          ctx.font = 'bold 95px "Noto Sans TC"';
          ctx.fillText('公克／人', cx + colW - 140, cy + 360);
        });
      });

      // -----------------------------------------------------------------
      // 3. 中層：長條圖（左）與 數據表格（右）
      // -----------------------------------------------------------------
      const midY = 3620;
      const midH = 2680;
      fillRoundRect(220, midY, CANVAS_WIDTH - 440, midH, 70, '#FFFFFF', '#CFD8DC', 8);

      // 左側標題橫幅
      fillRoundRect(350, midY + 80, 3050, 240, 120, '#1B5E39', '#0D3C22', 8);
      drawLeaf(450, midY + 200, 1.2, 40, '#81C784');
      drawLeaf(3250, midY + 200, 1.2, -40, '#81C784');
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 135px "Noto Sans TC"';
      ctx.textAlign = 'center';
      ctx.fillText('每週人均廚餘量（公克／人）', 350 + 1525, midY + 245);

      // 3A. 分組長條圖 (BAR CHART ON LEFT)
      const chartX = 550, chartY = midY + 450, chartW = 3450, chartH = 1850;
      const yMax = 160;

      // 繪製 Y 軸格線
      const yTicks = [0, 20, 40, 60, 80, 100, 120, 140, 160];
      ctx.strokeStyle = '#EEEEEE';
      ctx.lineWidth = 4;
      yTicks.forEach(tick => {
        const ty = chartY + chartH - (tick / yMax) * chartH;
        ctx.beginPath();
        ctx.moveTo(chartX, ty);
        ctx.lineTo(chartX + chartW, ty);
        ctx.stroke();

        ctx.textAlign = 'right';
        ctx.fillStyle = '#424242';
        ctx.font = 'bold 85px "Noto Sans TC"';
        ctx.fillText(tick.toString(), chartX - 40, ty + 30);
      });

      // 繪製長條圖柱狀 (三週三色)
      const barColors = ['#2E7D32', '#FBC02D', '#EF5350'];
      const classStep = chartW / EVAL_CLASSES.length;
      const barW = classStep * 0.25;

      EVAL_CLASSES.forEach((cls, cIdx) => {
        const groupX = chartX + cIdx * classStep + classStep * 0.12;

        data.weeksArray.slice(0, 3).forEach((w, wIdx) => {
          const val = data.weeklyStats[w][cls.id] || 0;
          const bh = (Math.min(val, yMax) / yMax) * chartH;
          const bx = groupX + wIdx * (barW + 8);
          const by = chartY + chartH - bh;

          ctx.fillStyle = barColors[wIdx % barColors.length];
          ctx.fillRect(bx, by, barW, bh);
        });

        // 班級 X 軸文字
        ctx.textAlign = 'center';
        ctx.fillStyle = '#212121';
        ctx.font = 'bold 90px "Noto Sans TC"';
        ctx.fillText(cls.short, groupX + barW * 1.5, chartY + chartH + 130);
      });

      // 圖例 (Legend)
      const legY = chartY + chartH + 280;
      data.weeksArray.slice(0, 3).forEach((w, wIdx) => {
        const lx = chartX + 600 + wIdx * 900;
        ctx.fillStyle = barColors[wIdx];
        ctx.fillRect(lx, legY - 70, 100, 70);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#212121';
        ctx.font = '900 95px "Noto Sans TC"';
        ctx.fillText(`第${w}週`, lx + 140, legY - 10);
      });

      // 3B. 數據總表 (TABLE ON RIGHT)
      const tblX = 4250, tblY = midY + 120, tblW = 2300, rowH = 185;

      // 表頭 (深綠底白字)
      fillRoundRect(tblX, tblY, tblW, rowH, 20, '#A7D7C5', '#4E8D7C', 6);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#103B2B';
      ctx.font = '900 95px "Noto Sans TC"';
      ctx.fillText('班級', tblX + 280, tblY + 125);

      const tColW = (tblW - 560) / 3;
      data.weeksArray.slice(0, 3).forEach((w, i) => {
        ctx.fillText(`第${w}週`, tblX + 560 + i * tColW + tColW/2, tblY + 125);
      });

      // 表身 rows
      EVAL_CLASSES.forEach((cls, rIdx) => {
        const ry = tblY + (rIdx + 1) * rowH + 15;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(tblX, ry, tblW, rowH);
        ctx.strokeStyle = '#B0BEC5';
        ctx.lineWidth = 3;
        ctx.strokeRect(tblX, ry, tblW, rowH);

        // 班級
        ctx.fillStyle = '#212121';
        ctx.font = 'bold 90px "Noto Sans TC"';
        ctx.fillText(cls.short, tblX + 280, ry + 120);

        // 3 週人均數值
        data.weeksArray.slice(0, 3).forEach((w, i) => {
          const val = data.weeklyStats[w][cls.id];
          ctx.font = '900 95px "Noto Sans TC"';
          ctx.fillStyle = '#263238';
          ctx.fillText(val !== null ? val.toString() : '-', tblX + 560 + i * tColW + tColW/2, ry + 120);
        });
      });

      // -----------------------------------------------------------------
      // 4. 下層：進步獎雙欄大牌 (PROGRESS AWARDS)
      // -----------------------------------------------------------------
      const btmY = 6450;
      const btmH = 3000;
      const cardHalfW = 3150;

      // 4A. 左側：第 2 週進步獎 (大版面二甲)
      const w2 = data.weeksArray[1] || data.weeksArray[0];
      fillRoundRect(220, btmY, cardHalfW, btmH, 60, '#1B5E39', '#0D3C22', 8);

      // 金黃獎盃標頭
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 155px "Noto Sans TC"';
      ctx.textAlign = 'center';
      ctx.fillText(`🏆 第${w2}週進步獎 🌿`, 220 + cardHalfW / 2, btmY + 280);

      // 暖米黃中央展示大卡
      const p2CardY = btmY + 450;
      fillRoundRect(360, p2CardY, cardHalfW - 280, 2050, 60, '#FFF9C4', '#FBC02D', 6);

      const p2List = data.progressAwards[w2] || [];
      if (p2List.length > 0) {
        const top1 = p2List[0];
        ctx.fillStyle = '#B71C1C';
        ctx.font = '900 480px "Noto Sans TC"';
        ctx.fillText(top1.name, 220 + cardHalfW / 2, p2CardY + 980);

        ctx.fillStyle = '#1B5E20';
        ctx.font = '900 240px "Noto Sans TC"';
        ctx.fillText(`改善 ${top1.rate}%`, 220 + cardHalfW / 2, p2CardY + 1600);
      } else {
        ctx.fillStyle = '#757575';
        ctx.font = 'bold 140px "Noto Sans TC"';
        ctx.fillText('本週無班級達標', 220 + cardHalfW / 2, p2CardY + 1100);
      }

      // 4B. 右側：第 3 週進步獎 (多班清單)
      const w3 = data.weeksArray[2] || data.weeksArray[1];
      const rightX = CANVAS_WIDTH - 220 - cardHalfW;
      fillRoundRect(rightX, btmY, cardHalfW, btmH, 60, '#1B5E39', '#0D3C22', 8);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 155px "Noto Sans TC"';
      ctx.fillText(`🏆 第${w3}週進步獎 🌿`, rightX + cardHalfW / 2, btmY + 280);

      const p3CardY = btmY + 450;
      fillRoundRect(rightX + 140, p3CardY, cardHalfW - 280, 2050, 60, '#FFFFFF', '#E0E0E0', 6);

      const p3List = data.progressAwards[w3] || [];
      if (p3List.length > 0) {
        p3List.slice(0, 4).forEach((item, idx) => {
          const iy = p3CardY + 180 + idx * 460;
          fillRoundRect(rightX + 220, iy, cardHalfW - 440, 380, 30, '#FFEBEE', '#FFCDD2', 4);

          // 班級
          ctx.textAlign = 'left';
          ctx.fillStyle = '#B71C1C';
          ctx.font = '900 240px "Noto Sans TC"';
          ctx.fillText(item.name, rightX + 380, iy + 280);

          // 改善文字
          ctx.textAlign = 'right';
          ctx.fillStyle = '#212121';
          ctx.font = 'bold 150px "Noto Sans TC"';
          ctx.fillText('改善', rightX + cardHalfW - 900, iy + 270);

          ctx.fillStyle = '#C62828';
          ctx.font = '900 200px "Noto Sans TC"';
          ctx.fillText(`${item.rate}%`, rightX + cardHalfW - 320, iy + 270);
        });
      } else {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#757575';
        ctx.font = 'bold 140px "Noto Sans TC"';
        ctx.fillText('本週無班級達標', rightX + cardHalfW / 2, p3CardY + 1100);
      }

      // -----------------------------------------------------------------
      // 5. 底部木紋看板與環保桶插畫
      // -----------------------------------------------------------------
      // 左下木紋看板
      const signX = 260, signY = CANVAS_HEIGHT - 750;
      fillRoundRect(signX, signY, 1200, 360, 40, '#D7CCC8', '#8D6E63', 10);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#3E2723';
      ctx.font = '900 115px "Noto Sans TC"';
      ctx.fillText('減少廚餘', signX + 600, signY + 150);
      ctx.fillText('更美好的明天', signX + 600, signY + 280);

      // 右下綠色環保回收桶
      const binX = CANVAS_WIDTH - 850, binY = CANVAS_HEIGHT - 850;
      fillRoundRect(binX, binY, 520, 620, 40, '#2E7D32', '#1B5E20', 10);
      fillRoundRect(binX - 40, binY - 60, 600, 100, 20, '#1B5E20', null);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 200px "Noto Sans TC"';
      ctx.fillText('♻', binX + 260, binY + 380);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#1B5E20';
      ctx.font = 'bold 100px "Noto Sans TC"';
      ctx.fillText('不剩食・愛地球', binX - 50, binY + 300);
      ctx.fillText('從每天開始', binX - 50, binY + 430);

      // 底部標準附註
      ctx.textAlign = 'center';
      ctx.fillStyle = '#212121';
      ctx.font = 'bold 85px "Noto Sans TC"';
      ctx.fillText('進步獎標準：較前一週降低超過5%，週冠軍不重複列入。', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 480);
      ctx.font = '500 75px "Noto Sans TC"';
      ctx.fillStyle = '#616161';
      ctx.fillText('六乙第3週週四為0人用餐，該日不列入平均，以其餘3個有效日計算。', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 360);
    }

    // 下載 A1 印刷 PNG
    window.downloadPosterImage = function() {
      const canvas = document.getElementById('posterCanvas');
      const startW = document.getElementById('start-week').value;
      const endW = document.getElementById('end-week').value;

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `惜食榮譽榜海報_第${startW}週至第${endW}週_A1印刷300DPI.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png', 1.0);
    };
  </script>
</body>
</html>
